[project]
name = "pyside-hatch-project"
dynamic = ["version"]
description = "Hatchling build hook and CLI that compiles PySide6 .ui, .ts and .qrc files"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Tomas Karabela", email = "tkarabela@seznam.cz" },
]
keywords = ["hatch", "hatchling", "pyside6", "qt", "uic", "rcc", "lrelease", "lupdate"]
classifiers = [
    "Environment :: Plugins",
    "Framework :: Hatch",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
dependencies = [
    # 1.12 is the first release where BuildHookInterface is Generic (subscripted at runtime)
    "hatchling>=1.12",
    # 6.6 is the first release installable on Python 3.12
    "pyside6-essentials>=6.6",
]

[project.urls]
Homepage = "https://github.com/tkarabela/pyside-hatch-project"
Issues = "https://github.com/tkarabela/pyside-hatch-project/issues"

[project.scripts]
pyside-hatch-project = "pyside_hatch_project:main"

[project.entry-points.hatch]
pyside-hatch-project = "pyside_hatch_project"

[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "pytest>=8.4",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs>=0.5"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.sdist]
exclude = ["/.github"]

[tool.uv]
# Rebuild the editable install when the commit or tags change, so the version stays current
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.pyrefly]
preset = "strict"
project-excludes = ["tests/dummy_project/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not e2e", "--strict-markers"]
markers = [
    "e2e: end-to-end builds in fresh virtual environments (slow, needs network)",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
