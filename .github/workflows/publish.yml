name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  publish:
    name: publish to PyPI
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/pyside-hatch-project/
    permissions:
      contents: read
      id-token: write  # PyPI trusted publishing

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # hatch-vcs derives the version from git tags

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.4"

      - name: Build
        run: uv build

      - name: Check version matches tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls dist/
          test -f "dist/pyside-hatch-project-${version}.tar.gz"
          test -f "dist/pyside-hatch-project-${version}-py3-none-any.whl"

      - name: Publish
        run: uv publish
