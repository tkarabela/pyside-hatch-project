name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python }}, ${{ matrix.deps }} deps)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Latest dependencies, as locked in uv.lock
          - { os: ubuntu-latest, python: "3.12", deps: latest }
          - { os: ubuntu-latest, python: "3.13", deps: latest }
          - { os: ubuntu-latest, python: "3.14", deps: latest }
          - { os: ubuntu-latest, python: "3.15", deps: latest }
          - { os: windows-latest, python: "3.14", deps: latest }
          - { os: macos-latest, python: "3.14", deps: latest }
          # Oldest supported dependencies. The lowest installable PySide6 depends on the Python version,
          # the floors for Python 3.12 must match the lower bounds in pyproject.toml.
          - { os: ubuntu-latest, python: "3.12", deps: minimum, hatchling: "1.12.0", pyside6: "6.6.0" }
          - { os: ubuntu-latest, python: "3.13", deps: minimum, hatchling: "1.12.0", pyside6: "6.8.0.2" }
          - { os: ubuntu-latest, python: "3.14", deps: minimum, hatchling: "1.12.0", pyside6: "6.10.1" }
          - { os: ubuntu-latest, python: "3.15", deps: minimum, hatchling: "1.12.0", pyside6: "6.12.0" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # hatch-vcs derives the version from git tags
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - name: Downgrade to minimum dependency versions
        if: matrix.deps == 'minimum'
        run: uv pip install "hatchling==${{ matrix.hatchling }}" "pyside6-essentials==${{ matrix.pyside6 }}"
      - name: Show dependency versions
        run: uv pip list
      - run: uv run --no-sync pytest

  e2e:
    name: e2e (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run --no-sync pytest -m e2e

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync pyrefly check
      - run: uv run --no-sync pytest --cov=./ --cov-report=xml
      - uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2  # v6.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          env_vars: OS,PYTHON
